spring.application.name=employee-service
server.port=8081

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employee_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Local-only fallback. Real deployments must override via JWT_SECRET env var.
# Generate one with: openssl rand -base64 48
jwt.secret=${JWT_SECRET:dev-only-secret-do-not-use-in-any-real-deployment-abc123}
jwt.expiration-ms=86400000
